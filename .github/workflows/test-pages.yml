name: Test GitHub Pages build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build static site
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_PAGES_BASE: /
          VITE_APP_BASE_URL: http://127.0.0.1:4173
        run: bun run build:pages

      - name: Check generated Pages files
        run: |
          test -s dist-pages/index.html
          test -s dist-pages/404.html
          test -n "$(find dist-pages/assets -type f -print -quit)"

      - name: Smoke test generated site
        run: |
          python3 -m http.server 4173 --directory dist-pages >/tmp/send-pages-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..10}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /tmp/send-pages-home.html; then
              break
            fi
            sleep 1
          done
          grep -q "Send" /tmp/send-pages-home.html
          curl --fail --silent http://127.0.0.1:4173/404.html | grep -q "Send"

      - name: Upload Pages build for manual testing
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-preview
          path: dist-pages
          retention-days: 7
